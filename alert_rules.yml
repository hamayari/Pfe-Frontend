groups:
  - name: ux-alerts
    rules:
      # UX Performance Alerts
      - alert: HighPageLoadTime
        expr: app_page_load_time_seconds > 3
        for: 2m
        labels:
          severity: warning
          category: ux
        annotations:
          summary: "Page load time is high"
          description: "Page {{ $labels.page }} is taking {{ $value }}s to load"

      - alert: CriticalPageLoadTime
        expr: app_page_load_time_seconds > 5
        for: 1m
        labels:
          severity: critical
          category: ux
        annotations:
          summary: "Critical page load time"
          description: "Page {{ $labels.page }} is taking {{ $value }}s to load"

      # User Experience Alerts
      - alert: LowActionSuccessRate
        expr: app_action_success_rate < 90
        for: 5m
        labels:
          severity: warning
          category: ux
        annotations:
          summary: "Low action success rate"
          description: "Action success rate is {{ $value }}%"

      - alert: CriticalActionSuccessRate
        expr: app_action_success_rate < 80
        for: 2m
        labels:
          severity: critical
          category: ux
        annotations:
          summary: "Critical action success rate"
          description: "Action success rate is {{ $value }}%"

      - alert: LowSessionCompletionRate
        expr: app_session_completion_rate < 70
        for: 10m
        labels:
          severity: warning
          category: ux
        annotations:
          summary: "Low session completion rate"
          description: "Session completion rate is {{ $value }}%"

      - alert: LowNotificationClickRate
        expr: app_notification_click_rate < 20
        for: 15m
        labels:
          severity: warning
          category: ux
        annotations:
          summary: "Low notification engagement"
          description: "Notification click rate is {{ $value }}%"

  - name: business-alerts
    rules:
      # Convention Management Alerts
      - alert: HighExpiredConventions
        expr: app_conventions_expired / app_conventions_total > 0.1
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "High number of expired conventions"
          description: "{{ $value | humanizePercentage }} of conventions are expired"

      - alert: CriticalExpiredConventions
        expr: app_conventions_expired / app_conventions_total > 0.2
        for: 2m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "Critical number of expired conventions"
          description: "{{ $value | humanizePercentage }} of conventions are expired"

      - alert: LowComplianceRate
        expr: app_conventions_compliance_rate < 85
        for: 10m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Low convention compliance rate"
          description: "Convention compliance rate is {{ $value }}%"

      # Invoice Management Alerts
      - alert: HighOverdueInvoices
        expr: app_invoices_overdue / app_invoices_total > 0.15
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "High number of overdue invoices"
          description: "{{ $value | humanizePercentage }} of invoices are overdue"

      - alert: CriticalOverdueInvoices
        expr: app_invoices_overdue / app_invoices_total > 0.25
        for: 2m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "Critical number of overdue invoices"
          description: "{{ $value | humanizePercentage }} of invoices are overdue"

      # Payment Alerts
      - alert: HighPaymentOverdueRate
        expr: app_payments_overdue_rate > 10
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "High payment overdue rate"
          description: "Payment overdue rate is {{ $value }}%"

      - alert: CriticalPaymentOverdueRate
        expr: app_payments_overdue_rate > 20
        for: 2m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "Critical payment overdue rate"
          description: "Payment overdue rate is {{ $value }}%"

      # Notification Alerts
      - alert: LowNotificationResponseRate
        expr: app_notification_response_rate < 30
        for: 15m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Low notification response rate"
          description: "Notification response rate is {{ $value }}%"

  - name: technical-alerts
    rules:
      # API Performance Alerts
      - alert: HighAPIResponseTime
        expr: app_api_response_time_seconds > 2
        for: 2m
        labels:
          severity: warning
          category: technical
        annotations:
          summary: "High API response time"
          description: "API response time is {{ $value }}s"

      - alert: CriticalAPIResponseTime
        expr: app_api_response_time_seconds > 5
        for: 1m
        labels:
          severity: critical
          category: technical
        annotations:
          summary: "Critical API response time"
          description: "API response time is {{ $value }}s"

      - alert: HighAPIErrorRate
        expr: app_api_error_rate > 5
        for: 2m
        labels:
          severity: warning
          category: technical
        annotations:
          summary: "High API error rate"
          description: "API error rate is {{ $value }}%"

      - alert: CriticalAPIErrorRate
        expr: app_api_error_rate > 10
        for: 1m
        labels:
          severity: critical
          category: technical
        annotations:
          summary: "Critical API error rate"
          description: "API error rate is {{ $value }}%"

      # System Resource Alerts
      - alert: HighCPUUsage
        expr: app_system_cpu_usage > 80
        for: 5m
        labels:
          severity: warning
          category: technical
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      - alert: CriticalCPUUsage
        expr: app_system_cpu_usage > 90
        for: 2m
        labels:
          severity: critical
          category: technical
        annotations:
          summary: "Critical CPU usage"
          description: "CPU usage is {{ $value }}%"

      - alert: HighMemoryUsage
        expr: app_system_memory_usage > 85
        for: 5m
        labels:
          severity: warning
          category: technical
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: app_system_memory_usage > 95
        for: 2m
        labels:
          severity: critical
          category: technical
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage is {{ $value }}%"

      - alert: HighDiskUsage
        expr: app_system_disk_usage > 85
        for: 10m
        labels:
          severity: warning
          category: technical
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value }}%"

      - alert: CriticalDiskUsage
        expr: app_system_disk_usage > 95
        for: 5m
        labels:
          severity: critical
          category: technical
        annotations:
          summary: "Critical disk usage"
          description: "Disk usage is {{ $value }}%"

  - name: user-activity-alerts
    rules:
      # User Activity Alerts
      - alert: LowActiveUsers
        expr: app_active_users_total < 5
        for: 10m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Low active users"
          description: "Only {{ $value }} active users"

      - alert: NoActiveUsers
        expr: app_active_users_total == 0
        for: 5m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "No active users"
          description: "No active users detected"

  - name: business-process-alerts
    rules:
      # Business Process Alerts
      - alert: NoConventionsCreated
        expr: increase(app_conventions_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
          category: business
        annotations:
          summary: "No new conventions created"
          description: "No conventions have been created in the last hour"

      - alert: NoInvoicesProcessed
        expr: increase(app_invoices_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
          category: business
        annotations:
          summary: "No invoices processed"
          description: "No invoices have been processed in the last hour"

      - alert: NoPaymentsReceived
        expr: increase(app_payments_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
          category: business
        annotations:
          summary: "No payments received"
          description: "No payments have been received in the last hour"

