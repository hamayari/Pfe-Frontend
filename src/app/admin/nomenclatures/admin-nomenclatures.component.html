<div class="admin-nomenclatures-container" [class.loading]="loading">
  <mat-card class="section-card">
    <div class="nomenclatures-header">
      <h1 class="page-title">
        <mat-icon>category</mat-icon>
        <span>Gestion des Nomenclatures</span>
      </h1>
      <span class="spacer"></span>
      <button mat-flat-button color="primary" (click)="openAddNomenclatureDialog()">
        <mat-icon>add</mat-icon>
        <span>Ajouter Nomenclature</span>
      </button>
    </div>
    <mat-card-content>
      <div class="filters-section">
        <mat-form-field class="filter-field" appearance="outline">
          <mat-label>Type</mat-label>
          <mat-select [(ngModel)]="selectedNomenclatureType" (selectionChange)="applyNomenclatureFilters()">
            <mat-option value="">Tous les types</mat-option>
            <mat-option value="APPLICATION">Application</mat-option>
            <mat-option value="ZONE">Zone</mat-option>
            <mat-option value="STRUCTURE">Structure</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field class="filter-field" appearance="outline">
          <mat-label>Recherche</mat-label>
          <input matInput [(ngModel)]="nomenclatureSearchTerm" (input)="applyNomenclatureFilters()" placeholder="Nom, description...">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>
      <div class="table-container">
        <table mat-table [dataSource]="filteredNomenclatures" class="mat-elevation-z1 nomenclatures-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nom</th>
            <td mat-cell *matCellDef="let n">{{ n.name }}</td>
          </ng-container>
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let n">
              <span class="type-chip type-primary">{{ n.type }}</span>
            </td>
          </ng-container>
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let n">{{ n.description }}</td>
          </ng-container>
          <ng-container matColumnDef="usage">
            <th mat-header-cell *matHeaderCellDef>Usage</th>
            <td mat-cell *matCellDef="let n">{{ n.usage }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let n">
              <button mat-icon-button color="primary" matTooltip="Modifier la nomenclature" (click)="editNomenclature(n)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" matTooltip="Supprimer la nomenclature" (click)="deleteNomenclature(n)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedNomenclaturesColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedNomenclaturesColumns;"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedNomenclaturesColumns.length">
              Aucune nomenclature ne correspond aux filtres.
            </td>
          </tr>
        </table>
      </div>
      <!-- Pagination (à activer côté TS si besoin) -->
      <!-- <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator> -->
    </mat-card-content>
  </mat-card>
</div>
