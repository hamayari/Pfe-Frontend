<div class="audit-history-container">
  <h2>Historique des actions</h2>
  <div class="filters-row">
    <mat-form-field appearance="outline">
      <mat-label>Type d'entité</mat-label>
      <input matInput [(ngModel)]="filters.entityType" (ngModelChange)="applyFilter()" placeholder="CONVENTION, INVOICE...">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>ID entité</mat-label>
      <input matInput [(ngModel)]="filters.entityId" (ngModelChange)="applyFilter()">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Action</mat-label>
      <input matInput [(ngModel)]="filters.action" (ngModelChange)="applyFilter()" placeholder="CREATE, DELETE...">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Utilisateur</mat-label>
      <input matInput [(ngModel)]="filters.username" (ngModelChange)="applyFilter()">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Date début</mat-label>
      <input matInput type="datetime-local" [(ngModel)]="filters.startDate" (ngModelChange)="applyFilter()">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Date fin</mat-label>
      <input matInput type="datetime-local" [(ngModel)]="filters.endDate" (ngModelChange)="applyFilter()">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Recherche</mat-label>
      <input matInput [formControl]="search" placeholder="Texte libre...">
    </mat-form-field>
  </div>
  <table mat-table [dataSource]="auditLogs" class="mat-elevation-z2">
    <ng-container matColumnDef="timestamp">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let log">{{ log.timestamp | date:'short' }}</td>
    </ng-container>
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
      <td mat-cell *matCellDef="let log">{{ log.username }}</td>
    </ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let log">{{ log.action }}</td>
    </ng-container>
    <ng-container matColumnDef="entityType">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let log">{{ log.entityType }}</td>
    </ng-container>
    <ng-container matColumnDef="entityId">
      <th mat-header-cell *matHeaderCellDef>ID entité</th>
      <td mat-cell *matCellDef="let log">{{ log.entityId }}</td>
    </ng-container>
    <ng-container matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>Détails</th>
      <td mat-cell *matCellDef="let log">{{ log.details }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [length]="total" [pageSize]="pageSize" [pageIndex]="pageIndex" (page)="onPage($event)"></mat-paginator>
  <div *ngIf="loading" class="loading-bar">Chargement...</div>
</div>
