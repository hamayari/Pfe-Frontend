<h2 mat-dialog-title>Timeline de la facture</h2>
<mat-dialog-content>
  <div class="facture-details">
    <div><strong>Référence :</strong> {{ facture.reference }}</div>
    <div><strong>Montant :</strong> {{ facture.montant | number:'1.0-2' }} DT</div>
    <div><strong>Échéance :</strong> {{ facture.echeance | date:'shortDate' }}</div>
    <div><strong>Statut :</strong> {{ facture.statut }}</div>
  </div>
  <app-process-timeline [steps]="steps"></app-process-timeline>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Fermer</button>
</mat-dialog-actions>
