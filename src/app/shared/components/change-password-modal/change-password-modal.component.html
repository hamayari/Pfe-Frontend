<div class="change-password-modal">
  <h2 mat-dialog-title>
    <mat-icon>vpn_key</mat-icon>
    Changer le mot de passe
  </h2>

  <mat-dialog-content>
    <form (ngSubmit)="onSubmit()" #passwordForm="ngForm">
      <!-- Ancien mot de passe -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Ancien mot de passe</mat-label>
        <mat-icon matPrefix>lock_outline</mat-icon>
        <input 
          matInput 
          [type]="hideOldPassword ? 'password' : 'text'"
          [(ngModel)]="oldPassword"
          name="oldPassword"
          required
          placeholder="Entrez votre ancien mot de passe">
        <button 
          mat-icon-button 
          matSuffix 
          type="button"
          (click)="hideOldPassword = !hideOldPassword"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hideOldPassword">
          <mat-icon>{{hideOldPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <!-- Nouveau mot de passe -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nouveau mot de passe</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input 
          matInput 
          [type]="hideNewPassword ? 'password' : 'text'"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
          placeholder="Entrez votre nouveau mot de passe">
        <button 
          mat-icon-button 
          matSuffix 
          type="button"
          (click)="hideNewPassword = !hideNewPassword"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hideNewPassword">
          <mat-icon>{{hideNewPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-hint>Au moins 6 caractères</mat-hint>
      </mat-form-field>

      <!-- Confirmation du nouveau mot de passe -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmer le nouveau mot de passe</mat-label>
        <mat-icon matPrefix>lock_clock</mat-icon>
        <input 
          matInput 
          [type]="hideConfirmPassword ? 'password' : 'text'"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          placeholder="Confirmez votre nouveau mot de passe">
        <button 
          mat-icon-button 
          matSuffix 
          type="button"
          (click)="hideConfirmPassword = !hideConfirmPassword"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hideConfirmPassword">
          <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" [disabled]="isLoading">
      <mat-icon>close</mat-icon>
      Annuler
    </button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="onSubmit()"
      [disabled]="isLoading || !oldPassword || !newPassword || !confirmPassword">
      <mat-icon>check</mat-icon>
      {{ isLoading ? 'Changement en cours...' : 'Changer le mot de passe' }}
    </button>
  </mat-dialog-actions>
</div>
