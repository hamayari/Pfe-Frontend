<mat-sidenav-container class="sidenav-container">
  <!-- Sidebar -->
  <mat-sidenav #sidenav class="sidenav custom-sidebar" 
      [ngClass]="getSidebarClass()"
      fixedInViewport="true"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="!(isHandset$ | async)">
    <div class="sidebar-header">
      <img src="assets/logo.svg" alt="Logo" class="sidebar-logo" />
      <span class="sidebar-title">GestionPro</span>
    </div>
    <nav class="sidebar-menu">
      <ng-container *ngFor="let section of navSections">
        <div *ngIf="section.section" class="sidebar-section-title">{{ section.section }}</div>
        <mat-nav-list>
          <ng-container *ngFor="let item of section.items">
            <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link" tabindex="0">
              <mat-icon>{{item.icon}}</mat-icon>
              <span>{{item.label}}</span>
            </a>
          </ng-container>
        </mat-nav-list>
        <div *ngIf="section.section" class="sidebar-separator"></div>
      </ng-container>
    </nav>
  </mat-sidenav>

  <!-- Contenu principal -->
  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="main-toolbar">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        class="menu-toggle"
        (click)="sidenav.toggle()"
        *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <a routerLink="/admin-dashboard" class="toolbar-brand">
        <mat-icon>dashboard</mat-icon>
        <span class="brand-text">GestionPro</span>
      </a>
      <span class="spacer"></span>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <mat-icon class="user-icon">account_circle</mat-icon>
        <span class="username" *ngIf="currentUser">{{ currentUser.username }}</span>
        <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" class="user-dropdown-menu">
        <button mat-menu-item routerLink="/profile" class="menu-item">
          <mat-icon>person</mat-icon>
          <span>Mon Profil</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" class="menu-item logout-item">
          <mat-icon>exit_to_app</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    <div class="page-content">
      <router-outlet></router-outlet>
      <mat-progress-spinner *ngIf="dataSource.data.length === 0 && isLoading" mode="indeterminate" diameter="40" color="primary" style="margin:2em auto;display:block;"></mat-progress-spinner>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
