<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ecf0f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" rx="10"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="360" height="40" fill="url(#card)" rx="5"/>
  <rect x="40" y="35" width="80" height="10" fill="#2c3e50" rx="2"/>
  <rect x="300" y="35" width="60" height="10" fill="#3498db" rx="2"/>
  
  <!-- Sidebar -->
  <rect x="20" y="80" width="80" height="200" fill="url(#card)" rx="5"/>
  <rect x="35" y="100" width="50" height="8" fill="#7f8c8d" rx="2"/>
  <rect x="35" y="120" width="50" height="8" fill="#7f8c8d" rx="2"/>
  <rect x="35" y="140" width="50" height="8" fill="#7f8c8d" rx="2"/>
  <rect x="35" y="160" width="50" height="8" fill="#7f8c8d" rx="2"/>
  
  <!-- Main Content -->
  <rect x="120" y="80" width="260" height="200" fill="url(#card)" rx="5"/>
  
  <!-- Chart Area -->
  <rect x="140" y="100" width="220" height="80" fill="#ecf0f1" rx="3"/>
  <rect x="150" y="110" width="20" height="60" fill="#3498db" rx="2"/>
  <rect x="180" y="120" width="20" height="50" fill="#e74c3c" rx="2"/>
  <rect x="210" y="105" width="20" height="65" fill="#f39c12" rx="2"/>
  <rect x="240" y="115" width="20" height="55" fill="#27ae60" rx="2"/>
  <rect x="270" y="110" width="20" height="60" fill="#9b59b6" rx="2"/>
  <rect x="300" y="125" width="20" height="45" fill="#1abc9c" rx="2"/>
  
  <!-- Stats Cards -->
  <rect x="140" y="200" width="70" height="60" fill="#3498db" rx="3"/>
  <rect x="150" y="210" width="50" height="8" fill="white" rx="2"/>
  <rect x="150" y="225" width="30" height="15" fill="white" rx="2"/>
  
  <rect x="230" y="200" width="70" height="60" fill="#e74c3c" rx="3"/>
  <rect x="240" y="210" width="50" height="8" fill="white" rx="2"/>
  <rect x="240" y="225" width="30" height="15" fill="white" rx="2"/>
  
  <rect x="320" y="200" width="60" height="60" fill="#f39c12" rx="3"/>
  <rect x="330" y="210" width="40" height="8" fill="white" rx="2"/>
  <rect x="330" y="225" width="25" height="15" fill="white" rx="2"/>
  
  <!-- Decorative Elements -->
  <circle cx="350" cy="50" r="3" fill="#e74c3c"/>
  <circle cx="360" cy="50" r="3" fill="#f39c12"/>
  <circle cx="370" cy="50" r="3" fill="#27ae60"/>
</svg>


















