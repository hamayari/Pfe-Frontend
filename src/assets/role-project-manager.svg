<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="projectGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#ffb74d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#projectGradient)" filter="url(#glow)"/>
  
  <!-- Project board -->
  <rect x="16" y="16" width="32" height="32" fill="white" rx="4"/>
  
  <!-- Task columns -->
  <rect x="20" y="20" width="8" height="24" fill="rgba(255,152,0,0.2)" rx="2"/>
  <rect x="32" y="20" width="8" height="24" fill="rgba(255,152,0,0.2)" rx="2"/>
  <rect x="44" y="20" width="8" height="24" fill="rgba(255,152,0,0.2)" rx="2"/>
  
  <!-- Column headers -->
  <text x="24" y="28" fill="#ff9800" font-size="6" text-anchor="middle" font-weight="bold">TODO</text>
  <text x="36" y="28" fill="#ff9800" font-size="6" text-anchor="middle" font-weight="bold">DOING</text>
  <text x="48" y="28" fill="#ff9800" font-size="6" text-anchor="middle" font-weight="bold">DONE</text>
  
  <!-- Task items -->
  <circle cx="24" cy="36" r="2" fill="#ff9800"/>
  <circle cx="24" cy="42" r="2" fill="#ff9800"/>
  <circle cx="36" cy="36" r="2" fill="#ff9800"/>
  <circle cx="48" cy="36" r="2" fill="#ff9800"/>
  <circle cx="48" cy="42" r="2" fill="#ff9800"/>
  
  <!-- Team collaboration -->
  <circle cx="28" cy="50" r="3" fill="white"/>
  <circle cx="36" cy="50" r="3" fill="white"/>
  <circle cx="44" cy="50" r="3" fill="white"/>
</svg>
