<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="decisionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0"/>
      <stop offset="100%" style="stop-color:#ba68c8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#decisionGradient)" filter="url(#glow)"/>
  
  <!-- Dashboard/Chart -->
  <rect x="16" y="20" width="32" height="24" fill="white" rx="3"/>
  
  <!-- Bar chart -->
  <rect x="20" y="40" width="4" height="8" fill="#9c27b0"/>
  <rect x="26" y="36" width="4" height="12" fill="#9c27b0"/>
  <rect x="32" y="32" width="4" height="16" fill="#9c27b0"/>
  <rect x="38" y="38" width="4" height="10" fill="#9c27b0"/>
  <rect x="44" y="34" width="4" height="14" fill="#9c27b0"/>
  
  <!-- Line chart -->
  <path d="M 20 44 L 26 40 L 32 36 L 38 42 L 44 38" stroke="#9c27b0" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Strategic elements -->
  <circle cx="28" cy="16" r="3" fill="white"/>
  <circle cx="36" cy="16" r="3" fill="white"/>
  <path d="M 28 16 L 36 16" stroke="white" stroke-width="1.5"/>
  
  <!-- Decision indicators -->
  <path d="M 12 48 L 20 48 M 44 48 L 52 48" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="48" r="2" fill="white"/>
  <circle cx="48" cy="48" r="2" fill="white"/>
</svg>
