<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="commercialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#66bb6a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#commercialGradient)" filter="url(#glow)"/>
  
  <!-- Building/Office -->
  <rect x="20" y="28" width="24" height="20" fill="white" rx="2"/>
  <rect x="24" y="32" width="4" height="4" fill="rgba(76,175,80,0.8)"/>
  <rect x="32" y="32" width="4" height="4" fill="rgba(76,175,80,0.8)"/>
  <rect x="24" y="40" width="4" height="4" fill="rgba(76,175,80,0.8)"/>
  <rect x="32" y="40" width="4" height="4" fill="rgba(76,175,80,0.8)"/>
  
  <!-- Roof -->
  <path d="M 16 28 L 32 16 L 48 28" fill="white"/>
  
  <!-- Growth chart -->
  <path d="M 12 48 L 20 44 L 28 46 L 36 40 L 44 42 L 52 38" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="20" cy="44" r="2" fill="white"/>
  <circle cx="28" cy="46" r="2" fill="white"/>
  <circle cx="36" cy="40" r="2" fill="white"/>
  <circle cx="44" cy="42" r="2" fill="white"/>
  <circle cx="52" cy="38" r="2" fill="white"/>
</svg>
