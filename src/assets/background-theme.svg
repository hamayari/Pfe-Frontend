<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.1"/>
    </linearGradient>
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="circleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  <rect width="1200" height="800" fill="url(#gridPattern)"/>
  
  <!-- Floating geometric shapes -->
  <circle cx="200" cy="150" r="80" fill="url(#circleGradient)"/>
  <circle cx="1000" cy="300" r="120" fill="url(#circleGradient)"/>
  <circle cx="150" cy="600" r="60" fill="url(#circleGradient)"/>
  <circle cx="950" cy="650" r="100" fill="url(#circleGradient)"/>
  
  <!-- Abstract business elements -->
  <g opacity="0.05">
    <rect x="50" y="100" width="200" height="150" rx="20" fill="white"/>
    <rect x="950" y="200" width="180" height="120" rx="15" fill="white"/>
    <rect x="100" y="500" width="160" height="100" rx="12" fill="white"/>
  </g>
  
  <!-- Connection lines -->
  <path d="M 300 200 Q 600 100 900 250" stroke="rgba(255,255,255,0.02)" stroke-width="2" fill="none"/>
  <path d="M 250 500 Q 500 400 800 550" stroke="rgba(255,255,255,0.02)" stroke-width="2" fill="none"/>
</svg>























