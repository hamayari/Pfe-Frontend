global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK'
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@conventions-app.com'
  smtp_auth_username: 'alerts@conventions-app.com'
  smtp_auth_password: 'your-app-password'

templates:
  - '/etc/alertmanager/template/*.tmpl'

route:
  group_by: ['alertname', 'category', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'team-conventions-slack'
  
  # Route critical alerts immediately
  routes:
    # Critical UX alerts - immediate notification
    - match:
        severity: critical
        category: ux
      receiver: 'team-conventions-slack'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: true

    # Critical business alerts - immediate notification to management
    - match:
        severity: critical
        category: business
      receiver: 'management-email'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m
      continue: true

    # Critical technical alerts - immediate notification to DevOps
    - match:
        severity: critical
        category: technical
      receiver: 'devops-slack'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m
      continue: true

    # Warning UX alerts - notify UX team
    - match:
        severity: warning
        category: ux
      receiver: 'ux-team-slack'
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 2h
      continue: true

    # Warning business alerts - notify business team
    - match:
        severity: warning
        category: business
      receiver: 'business-team-email'
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 4h
      continue: true

    # Warning technical alerts - notify DevOps team
    - match:
        severity: warning
        category: technical
      receiver: 'devops-slack'
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 2h
      continue: true

    # Default route for all other alerts
    - receiver: 'team-conventions-slack'

inhibit_rules:
  # Inhibit critical alerts when system is down
  - source_match:
      severity: 'critical'
      category: 'technical'
      alertname: 'CriticalCPUUsage'
    target_match:
      severity: 'warning'
    equal: ['instance']

  # Inhibit UX alerts when API is down
  - source_match:
      severity: 'critical'
      category: 'technical'
      alertname: 'CriticalAPIResponseTime'
    target_match:
      category: 'ux'
    equal: ['instance']

  # Inhibit business alerts when system resources are critical
  - source_match:
      severity: 'critical'
      category: 'technical'
    target_match:
      category: 'business'
    equal: ['instance']

receivers:
  - name: 'team-conventions-slack'
    slack_configs:
      - channel: '#conventions-alerts'
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        send_resolved: true
        icon_url: 'https://avatars3.githubusercontent.com/u/3380462'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ template "slack.grafana.url" . }}'
          - type: button
            text: 'Acknowledge'
            url: '{{ template "slack.ack.url" . }}'

  - name: 'devops-slack'
    slack_configs:
      - channel: '#devops-alerts'
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        send_resolved: true
        icon_emoji: ':warning:'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ template "slack.grafana.url" . }}'
          - type: button
            text: 'Acknowledge'
            url: '{{ template "slack.ack.url" . }}'

  - name: 'ux-team-slack'
    slack_configs:
      - channel: '#ux-alerts'
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        send_resolved: true
        icon_emoji: ':art:'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ template "slack.grafana.url" . }}'

  - name: 'management-email'
    email_configs:
      - to: 'management@conventions-app.com'
        subject: '{{ template "email.subject" . }}'
        html: '{{ template "email.html" . }}'
        send_resolved: true
        headers:
          priority: 'urgent'
          importance: 'high'

  - name: 'business-team-email'
    email_configs:
      - to: 'business-team@conventions-app.com'
        subject: '{{ template "email.subject" . }}'
        html: '{{ template "email.html" . }}'
        send_resolved: true

  # Webhook for integration with other systems
  - name: 'webhook'
    webhook_configs:
      - url: 'http://localhost:8080/api/alerts/webhook'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'webhook-user'
            password: 'webhook-password'

  # PagerDuty integration for critical alerts
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - routing_key: 'your-pagerduty-routing-key'
        description: '{{ template "pagerduty.description" . }}'
        severity: '{{ if eq .GroupLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        client: 'AlertManager'
        client_url: '{{ template "pagerduty.clientURL" . }}'
        details:
          firing: '{{ template "pagerduty.firing" . }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          num_resolved: '{{ .Alerts.Resolved | len }}'
          resolved: '{{ template "pagerduty.resolved" . }}'
          group_labels: '{{ template "pagerduty.groupLabels" . }}'
          common_labels: '{{ template "pagerduty.commonLabels" . }}'
          common_annotations: '{{ template "pagerduty.commonAnnotations" . }}'
          external_url: '{{ template "pagerduty.externalURL" . }}'

# Time intervals for different alert severities
time_intervals:
  - name: workdays
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: 09:00
            end_time: 17:00
        location: 'Europe/Paris'

  - name: weekends
    time_intervals:
      - weekdays: ['saturday', 'sunday']
        times:
          - start_time: 00:00
            end_time: 23:59
        location: 'Europe/Paris'

  - name: off_hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: 17:00
            end_time: 09:00
        location: 'Europe/Paris'
      - weekdays: ['saturday', 'sunday']
        times:
          - start_time: 00:00
            end_time: 23:59
        location: 'Europe/Paris'

